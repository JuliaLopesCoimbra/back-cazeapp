# Fase 1: HTTP + webroot ACME (PICBRAND ARCH §10).
# Sobe ANTES da emissão do certificado. Depois de emitir, ative
# 02-https.conf (renomeie 02-https.conf.disabled) e recarregue o nginx.
server {
  listen 80;
  server_name api-bbb27.picbrand.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
